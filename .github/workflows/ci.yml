name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall src api dashboard scripts tests
      - run: python -m unittest discover -v
      - run: python -c "import src.config; import api.main; import src.forecasting.backtesting; import src.inventory.decision_engine; print('smoke imports ok')"
      - run: python -c "from api.routes.health import health; assert health()['status'] == 'ok'; print('application smoke check ok')"
